\"cache extended a GPU buffer lifetime\");\n    return geometry.boundingBox;\n  }\n};\n\nvoid runtimeFixtures() {\n  Fixture f;\n  auto cache = f.resource.GetRemixBoundingBoxMemoizer();\n  auto revision = cache->revision();\n  lockCacheGuard(&f.resource, D3DLOCK_READONLY);\n  require(cache->revision() == revision, \"read-only lock treated as a write\");\n  for (uint32_t flags : {0u, 0x1000u, 0x8000u, D3DLOCK_DISCARD,\n                        D3DLOCK_DISCARD | D3DLOCK_READONLY}) {\n    lockCacheGuard(&f.resource, flags);\n    require(cache->revision() > revision, \"writable/discard lock retained cache revision\");\n    revision = cache->revision();\n  }\n  unlockCacheGuard(&f.resource);\n  require(cache->revision() > revision, \"unlock retained cache revision\");\n  auto reference = originalScan(f.bytes.data(), f.geometry.vertexCount, f.context.stride);\n  require(equal(f.draw(), reference), \"first miss differs from original scan\");\n  size_t jobs = f.worker.scheduled;\n  require(equal(f.draw(), reference), \"cached box differs from original scan\");\n  require(f.worker.scheduled == jobs && f.runtime.m_boundingBoxCounters.hits == 1,\n          \"cache hit scheduled a worker job\");\n  f.geometry.positionBuffer.data = nullptr;\n  require(!f.runtime.computeAxisAlignedBoundingBox(f.geometry, f.request()).valid() &&\n          f.worker.scheduled == jobs, \"null-map fallback submitted a scan\");\n  f.geometry.positionBuffer.data = f.bytes.data();\n  auto firstKey = f.request().key;\n  f.context.mappedSlice.handle += 1;\n  require(!(f.request().key == firstKey), \"physical mapping identity omitted\");\n  require(equal(f.draw(), reference) && f.worker.scheduled == jobs + 1,\n          \"mapping change reused an unrelated cache entry\");\n  f.context.mappedSlice.handle -= 1;\n  f.context.mappedSlice.offset += 128;\n  require(!(f.request().key == firstKey), \"mapping slice offset omitted\");\n  f.context.mappedSlice.offset -= 128;\n  f.context.offset = f.context.stride;\n  require(!f.request().cache, \"range extending beyond source allocation was cached\");\n  f.context.offset = 2 * f.context.stride;\n  auto shiftedBack = f.runtime.prepare(f.context, {}, -2, f.geometry);\n  require(shiftedBack.cache && shiftedBack.key == firstKey,\n          \"valid negative BaseVertexIndex did not cancel stream offset\");\n  f.context.offset = 0;\n  require(!f.runtime.prepare(f.context, {}, -1, f.geometry).cache,\n          \"negative source offset was cached\");\n  auto oldCount = f.geometry.vertexCount;\n  f.geometry.vertexCount -= 1;\n  require(f.request().cache && !(f.request().key == firstKey), \"vertex count omitted\");\n  f.geometry.vertexCount = oldCount;\n  jobs = f.worker.scheduled;\n\n  // Any supported write invalidates the source resource, including a vertex\n  // that an index list would not reference but the original scan includes.\n  f.resource.InvalidateRemixBoundingBoxes();\n  const float moved[3] = {-1000, 7000, -9000};\n  std::memcpy(f.bytes.data() + 3 * f.context.stride, moved, 12);\n  reference = originalScan(f.bytes.data(), f.geometry.vertexCount, f.context.stride);\n  require(equal(f.draw(), reference) && f.worker.scheduled == jobs + 1,\n          \"write retained stale bounds\");\n  f.resource.InvalidateRemixBoundingBoxes(); // Unlock / even a read-only unlock.\n  require(equal(f.draw(), reference) && f.worker.scheduled == jobs + 2,\n          \"unlock failed to force rescan\");\n\n  f.resource.SetWrittenByGPU(true);\n  require(!f.request().cache, \"GPU-written source was eligible\");\n  require(equal(f.draw(), reference), \"GPU-written fallback changed scan result\");\n  f.resource.SetWrittenByGPU(false);\n  require(equal(f.draw(), reference), \"GPU write reset reused old bounds\");\n  f.resource.locks = 1;\n  require(!f.request().cache, \"locked source was eligible\");\n  f.resource.locks = 0;\n  auto savedResource = f.context.pVBO;\n  f.context.pVBO = nullptr;\n  require(!f.request().cache, \"UP / untracked source was eligible\");\n  f.context.pVBO = savedResource;\n  f.runtime.enabled = false;\n  require(!f.request().cache, \"disabled cache still prepared a request\");\n  auto before = f.worker.scheduled;\n  require(equal(f.draw(), reference) && f.worker.scheduled == before + 1,\n          \"disabled option failed to scan\");\n  f.runtime.enabled = true;\n  RtxOptions::needs = false;\n  require(!f.request().cache, \"unneeded boxes allocated a cache request\");\n  before = f.worker.scheduled;\n  require(!f.runtime.computeAxisAlignedBoundingBox(f.geometry, {}).valid() &&\n          f.worker.scheduled == before, \"feature-off path submitted bounds\");\n  RtxOptions::needs = true;\n\n  // Older jobs can return their original draw's bounds, but cannot publish them\n  // as reusable values after the resource changes.\n  Fixture pending;\n  auto oldRequest = pending.request();\n  auto oldFuture = pending.runtime.computeAxisAlignedBoundingBox(pending.geometry, oldRequest);\n  pending.resource.InvalidateRemixBoundingBoxes();\n  pending.worker.runAll();\n  require(oldFuture.valid(), \"pending future disappeared\");\n  oldFuture.get();\n  AxisAlignedBoundingBox output;\n  const auto pendingRevision = oldRequest.cache->revision();\n  require(!oldRequest.cache->lookup(oldRequest.key, pendingRevision, output),\n          \"old worker repopulated a newer buffer revision\");\n  require(pending.buffer.refs == 1, \"pending task leaked buffer ref\");\n\n  // Resource release and address reuse cannot make an old cache belong to a\n  // new resource. Worker ownership retains only CPU state until completion.\n  std::weak_ptr<BoundingBoxMemoizer<AxisAlignedBoundingBox>> weak;\n  std::function<void()> late;\n  {\n    Resource original;\n    auto state = original.GetRemixBoundingBoxMemoizer();\n    weak = state;\n    late = [state] { require(state->revision() != 0, \"CPU state was lost\"); };\n  }\n  require(!weak.expired(), \"worker did not retain its CPU state\");\n  late();\n  late = {};\n  require(weak.expired(), \"CPU cache survived its final owner\");\n  Resource reusedAddress;\n  auto newCache = reusedAddress.GetRemixBoundingBoxMemoizer();\n  require(!newCache->lookup(oldRequest.key, newCache->revision(), output),\n          \"new resource inherited previous resource's bounds\");\n}\n\nvoid keyAndEvictionFixtures() {\n  BoundingBoxMemoizationKey key;\n  require(makeBoundingBoxMemoizationKey(1, 0, 0, 12, 1, 12, key), \"valid XYZ range rejected\");\n  require(!makeBoundingBoxMemoizationKey(0, 0, 0, 12, 1, 12, key), \"null mapping accepted\");\n  require(!makeBoundingBoxMemoizationKey(1, 0, -1, 12, 1, 12, key), \"negative base accepted\");\n  require(!makeBoundingBoxMemoizationKey(1, 0, 0, 12, 0, 12, key), \"empty draw accepted\");\n  require(!makeBoundingBoxMemoizationKey(1, 0, 0, 12, 1, 8, key), \"short stride accepted\");\n  require(!makeBoundingBoxMemoizationKey(1, 0, 1, 12, 1, 12, key), \"out-of-range XYZ accepted\");\n  require(!makeBoundingBoxMemoizationKey(1, 0, INT64_MAX, UINT64_MAX, UINT32_MAX,\n                                       UINT32_MAX, key), \"overflowing span accepted\");\n  require(makeBoundingBoxMemoizationKey(1, 16, 32, 76, 2, 32, key), \"exact boundary rejected\");\n  BoundingBoxMemoizer<AxisAlignedBoundingBox, 1, 4> cache;\n  const auto revision = cache.revision();\n  AxisAlignedBoundingBox value, found;\n  for (unsigned i = 0; i < 4; ++i) {\n    key.positionOffset = i * 32;\n    value.minPos.x = float(i);\n    require(cache.publish(key, revision, value), \"publish failed\");\n  }\n  key.positionOffset = 0;\n  require(cache.lookup(key, revision, found), \"first entry missing\");\n  key.positionOffset = 128;\n  cache.publish(key, revision, value);\n  key.positionOffset = 32;\n  require(!cache.lookup(key, revision, found), \"LRU eviction failed\");\n  key.positionOffset = 0;\n  require(cache.lookup(key, revision, found), \"recent entry evicted\");\n  cache.invalidate();\n  require(!cache.lookup(key, revision, found), \"old generation lookup