          start "" /wait "%~dp0HitmanBloodMoney.exe" %*
          endlocal
          '@ | Set-Content artifact\HBM_Record_Movement.cmd -Encoding ascii
          Copy-Item src\util\util_hbm_movement_diagnostics.h artifact\util_hbm_movement_diagnostics.h
          Copy-Item .hbm-movement-tests\patch_operations.json artifact\MOVEMENT_SOURCE_HASHES.json
