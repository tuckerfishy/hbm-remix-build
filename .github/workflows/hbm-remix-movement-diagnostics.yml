          files=json.loads(r"""{"empty_light_clear_under_test.h": "// Extracted verbatim from the patched production source.\n  void LightManager::clear() {\n    if (!m_lightDebugUILock.owns_lock()) {\n      m_lightDebugUILock.lock();\n    }\n    m_lights.clear();\n    m_linearizedLights.clear();\n    for (auto& pair : m_externalLights) pair.second.setBufferIdx(kNewLightIdx);\n    m_apiLightFrames.clear();\n    m_apiReplacementLights.clear();\n    m_lightDebugUILock.unlock();\n  }\n", "empty_light_cleanup_under_test.h": "// Extracted verbatim from the patched production source.\n    if (m_currentActiveLightCount == 0) {\n      // clear() uses m_lightDebugUILock to acquire and release m_lightUIMutex.\n      // A temporary API guard must release that same mutex before cleanup;\n      // otherwise an empty/disabled-light frame recursively locks it.\n      if (apiLightLock.owns_lock()) apiLightLock.unlock();\n      clear();\n      // clear() also releases an existing legacy frame lock. Reacquire before\n      // touching API frame bookkeeping, whichever owner held it on entry.\n      apiLightLock = lockApiLights();\n    }\n", "api_lock_under_test.h": "// Extracted verbatim from the patched production source.\n  std::unique_lock<std::mutex> lockApiLights() const {\n    std::unique_lock<std::mutex> lock(m_lightUIMutex, std::defer_lock);\n    if (!m_lightDebugUILock.owns_lock()) lock.lock();\n    return lock;\n  }\n", "test_empty_light_frame.cpp": "#include <cassert>\n#include <iostream>\n#include <mutex>\n#include <string>\n#include <thread>\n#include <unordered_map>\n#include <vector>\n#include \"../src/util/util_api_light_frames.h\"\nnamespace dxvk {\nconstexpr unsigned kNewLightIdx=0xffff;\nstruct Light {unsigned index=3;void setBufferIdx(unsigned value){index=value;}};\nstruct LightManager {\n  mutable std::mutex m_lightUIMutex;\n  std::unique_lock<std::mutex> m_lightDebugUILock{m_lightUIMutex,std::defer_lock};\n  std::unordered_map<unsigned,Light> m_lights,m_externalLights;\n  std::unordered_map<unsigned,std::vector<Light>> m_apiReplacementLights;\n  std::vector<unsigned> m_linearizedLights;\n  ApiLightFrames<unsigned> m_apiLightFrames;\n  unsigned m_currentActiveLightCount=0;\n#include \"api_lock_under_test.h\"\n  void clear();\n  void prepare(bool legacy=false) {\n    if(legacy)m_lightDebugUILock.lock();\n    auto apiLightLock=lockApiLights();\n#include \"empty_light_cleanup_under_test.h\"\n    // All post-clear API bookkeeping must still be protected. A separate\n    // thread must not acquire this mutex while finishFrame is pending.\n    bool available=false;\n    std::thread probe([&]{available=m_lightUIMutex.try_lock();if(available)m_lightUIMutex.unlock();});\n    probe.join();assert(!available);\n    m_apiLightFrames.finishFrame();\n  }\n  void oldPrepare() {\n    auto apiLightLock=lockApiLights();\n    if(m_currentActiveLightCount==0)clear();\n  }\n};\n#include \"empty_light_clear_under_test.h\"\n}\nint main(int argc,char** argv) {\n  using namespace dxvk;\n  if(argc==2&&std::string(argv[1])==\"--old-deadlock\") {\n    LightManager manager;manager.oldPrepare();return 1;\n  }\n  for(unsigned cycle=0;cycle<200;++cycle)for(bool legacy:{false,true}) {\n    LightManager manager;manager.m_lights.emplace(1,Light{});manager.m_externalLights.emplace(1,Light{});\n    manager.m_apiReplacementLights[1].push_back(Light{});manager.m_linearizedLights.push_back(1);\n    manager.m_apiLightFrames.submit(1,true);\n    manager.m_currentActiveLightCount=cycle%2;\n    manager.prepare(legacy);\n    if(manager.m_currentActiveLightCount==0) {\n      assert(manager.m_lights.empty()&&manager.m_linearizedLights.empty()&&manager.m_apiReplacementLights.empty());\n      assert(manager.m_apiLightFrames.empty()&&manager.m_externalLights.at(1).index==kNewLightIdx);\n      assert(!manager.m_lightDebugUILock.owns_lock());\n    }else {\n      assert(manager.m_lights.size()==1&&manager.m_apiLightFrames.captured().size()==1);\n      assert(manager.m_externalLights.at(1).index==3);\n      if(legacy)manager.m_lightDebugUILock.unlock();\n    }\n    assert(manager.m_lightUIMutex.try_lock());manager.m_lightUIMutex.unlock();\n  }\n  std::cout<<\"PASS: actual clear/cleanup/lock code; 400 empty/active frame cases, temporary and legacy owners, post-clear exclusion, retirement and balanced locks\\n\";\n}\n"}""")
