      - name: Apply movement diagnostics without changing rendering policy
        run: |
          @'
          # Applies only to the exact previously working HBM cumulative runtime.
          from pathlib import Path
          import base64, hashlib, json, subprocess, zlib
          REVISION = "e876135b37295dc203ccdb7b20a8089629588201"
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != REVISION:
              raise SystemExit("Unexpected source revision; refusing diagnostic patch")
          PAYLOAD = ""
          data = json.loads(zlib.decompress(base64.b64decode(PAYLOAD)))
          original = {}
          patched = {}
          for name, hashes in data["hashes"].items():
              raw = Path(name).read_bytes()
              text = raw.replace(b"\r\n", b"\n").decode("utf-8")
              if hashlib.sha256(text.encode()).hexdigest() != hashes["before"]:
                  raise SystemExit("Working HBM source differs from validated baseline: " + name)
              original[name] = raw
              patched[name] = text
          for op in data["operations"]:
              text = patched[op["file"]]
              if text.count(op["before"]) != op["count"]:
                  raise SystemExit("Nonunique diagnostic location: " + op["file"])
              patched[op["file"]] = text.replace(op["before"], op["after"])
          for name, text in patched.items():
              if hashlib.sha256(text.encode()).hexdigest() != data["hashes"][name]["after"]:
                  raise SystemExit("Diagnostic output failed verification: " + name)
          helper = data["helper"]
          if hashlib.sha256(helper.encode()).hexdigest() != data["helper_sha256"]:
              raise SystemExit("Diagnostic helper hash mismatch")
          # Compile the exact production call against the production matrix/vector class
          # declarations in the standalone test, without pulling unrelated GPU libraries.
          factory_namespace = {}
          exec(data["matrix_fixture_factory"], factory_namespace)
          fixture = factory_namespace["make_fixture"](
              Path("src/util/util_matrix.h").read_text(encoding="utf-8"),
              Path("src/util/util_vector.h").read_text(encoding="utf-8"),
              patched["src/dxvk/rtx_render/rtx_instance_manager.cpp"])
          # Validate everything before the first source write.
          for name, text in patched.items():
              out = text.encode()
              if b"\r\n" in original[name]: out = out.replace(b"\n", b"\r\n")
              Path(name).write_bytes(out)
          p = Path("src/util/util_hbm_movement_diagnostics.h")
          p.write_text(helper, encoding="utf-8")
          tests = Path(".hbm-movement-tests"); tests.mkdir(exist_ok=True)
          (tests / "test_movement.cpp").write_text(data["test"], encoding="utf-8")
          (tests / "matrix_types_under_test.h").write_text(fixture, encoding="utf-8")
          (tests / "patch_operations.json").write_text(json.dumps({k: data[k] for k in ["hashes", "helper_sha256"]}, indent=2))
          print("Applied movement diagnostics v1: 44 verified edits, rendering decisions unchanged")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -N src/util/util_hbm_movement_diagnostics.h src/util/util_api_light_frames.h src/util/util_bounding_box_memoization.h src/util/util_sorted_unique_indices.h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

