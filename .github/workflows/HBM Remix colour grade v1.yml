# Put this file at .github/workflows/hbm-remix-colour-grade-v1.yml in your existing build repository.
# Matrix type fix v2: typed Matrix4 access; regression compiles the actual production classes and call.
# Checked LZMA payloads keep this cumulative workflow below 480000 bytes.
# Existing CPU/GPU optimisations retained; the added colour grade defaults OFF.
# It builds only the x64 runtime DLL for the existing e876135b Remix installation.
name: Build HBM Remix colour grade v1

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: remix

    steps:
      - name: Fetch matching Remix source and submodules
        uses: actions/checkout@v4
        with:
          repository: NVIDIAGameWorks/dxvk-remix
          ref: e876135b37295dc203ccdb7b20a8089629588201
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
          path: remix

      - name: Install build helper
        run: |
          python -m pip install meson==1.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply the checked draw-state ownership fix
        run: |
          @'
          import base64,hashlib,lzma
          source=lzma.decompress(base64.b64decode(''))
          if hashlib.sha256(source).hexdigest()!='c9f1e5710100eb2ac66313e001476f118b23d5a6384694196efa86dbd8e3e636':
              raise SystemExit('Embedded workflow script checksum differs')
          exec(compile(source,'hbm_workflow_step_0.py','exec'))

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat

      - name: Apply and verify the index patch
        run: |
          @'
          import base64,hashlib,lzma
          source=lzma.decompress(base64.b64decode(''))
          if hashlib.sha256(source).hexdigest()!='edbf20e4f7160be4781a7ca982c9de6c02731b0380e55341e1117c7f34a1f436':
              raise SystemExit('Embedded workflow script checksum differs')
          exec(compile(source,'hbm_workflow_step_1.py','exec'))

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the index helper with x64 MSVC
        run: |
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          cl /nologo /O2 /EHsc /std:c++17 .hbm-tests\test_indices.cpp /Fe:.hbm-tests\test_indices.exe /Fo:.hbm-tests\test_indices.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.hbm-tests\test_indices.exe | Tee-Object .hbm-tests\validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.hbm-tests\test_indices.exe --benchmark | Tee-Object .hbm-tests\index_benchmark.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply the checked bounds cache
        run: |
          @'
          import base64,hashlib,lzma
          source=lzma.decompress(base64.b64decode(''))
          if hashlib.sha256(source).hexdigest()!='59b58599189a963091565ea54b8ce1e35d075e9cd53b46838cad86433844bd5b':
              raise SystemExit('Embedded workflow script checksum differs')
          exec(compile(source,'hbm_workflow_step_2.py','exec'))

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test bounds cache eligibility, invalidation and exact results
        run: |
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          cl /nologo /O2 /EHsc /std:c++17 .hbm-bounds-tests\test_bounds.cpp /Fe:.hbm-bounds-tests\test_bounds.exe /Fo:.hbm-bounds-tests\test_bounds.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.hbm-bounds-tests\test_bounds.exe | Tee-Object .hbm-bounds-tests\validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.hbm-bounds-tests\test_bounds.exe --benchmark | Tee-Object .hbm-bounds-tests\bounds_benchmark.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply API light capture and Toolkit replacements
        run: |
          @'
          import base64,hashlib,lzma
          source=lzma.decompress(base64.b64decode(''))
          if hashlib.sha256(source).hexdigest()!='285a63a95af3ddfc17efa478c0d0e9af8639e9f039d290f17ab89bc0f883138c':
              raise SystemExit('Embedded workflow script checksum differs')
          exec(compile(source,'hbm_workflow_step_3.py','exec'))

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test API light identity, capture, inheritance and lifecycle
        run: |
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          cl /nologo /O2 /EHsc /std:c++17 .hbm-api-light-tests\test_api_lights.cpp /Fe:.hbm-api-light-tests\test_api_lights.exe /Fo:.hbm-api-light-tests\test_api_lights.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.hbm-api-light-tests\test_api_lights.exe | Tee-Object .hbm-api-light-tests\validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and test empty-light frame deadlock fix v2
        run: |
          @'
          import base64,hashlib,lzma
          source=lzma.decompress(base64.b64decode(''))
          if hashlib.sha256(source).hexdigest()!='4f8d77e690b32707506c801979ea1d342db58a5291d4a543df15de02f97f4e62':
              raise SystemExit('Embedded workflow script checksum differs')
          exec(compile(source,'hbm_workflow_step_4.py','exec'))

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          cl /nologo /O2 /EHsc /std:c++17 .hbm-api-light-tests\test_empty_light_frame.cpp /Fe:.hbm-api-light-tests\test_empty_light_frame.exe /Fo:.hbm-api-light-tests\test_empty_light_frame.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.hbm-api-light-tests\test_empty_light_frame.exe | Tee-Object .hbm-api-light-tests\deadlock_validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply movement diagnostics without changing rendering policy
        run: |
          @'
          import base64,hashlib,lzma
          source=lzma.decompress(base64.b64decode(''))
          if hashlib.sha256(source).hexdigest()!='f170f4c91d831cf1ef65dbd3501898f42244bdbb24edf558430fec6ed794dce9':
              raise SystemExit('Embedded workflow script checksum differs')
          exec(compile(source,'hbm_workflow_step_5.py','exec'))

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -N src/util/util_hbm_movement_diagnostics.h src/util/util_api_light_frames.h src/util/util_bounding_box_memoization.h src/util/util_sorted_unique_indices.h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply verified rigid-geometry reuse with conservative fallbacks
        run: |
          @'
          import lzma
          # Complete guarded rigid-geometry patch atop the successful movement build.
          from pathlib import Path
          import base64, hashlib, json, subprocess, zlib, re, struct
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != "e876135b37295dc203ccdb7b20a8089629588201":
              raise SystemExit("Unexpected pinned revision")
          data=json.loads(lzma.decompress(base64.b64decode('')))
          original={}
          for name, item in data["files"].items():
              path=Path(name)
              if item["before"] is None:
                  if path.exists(): raise SystemExit("New helper already exists: " + name)
                  original[name]=b""
              else:
                  original[name]=path.read_bytes()
                  normal=original[name].replace(b"\r\n",b"\n")
                  if hashlib.sha256(normal).hexdigest()!=item["before"]:
                      raise SystemExit("Rigid patch baseline differs: " + name)
              if hashlib.sha256(item["contents"].encode()).hexdigest()!=item["after"]:
                  raise SystemExit("Rigid payload hash mismatch: " + name)
          for name, sha in data["reads"].items():
              if hashlib.sha256(Path(name).read_bytes().replace(b"\r\n",b"\n")).hexdigest()!=sha:
                  raise SystemExit("Pinned hashing source differs: " + name)
          proof_namespace={}
          exec(data["symbolic_proof"],proof_namespace)
          helper=data["files"]["src/util/util_hbm_rigid_geometry_reuse.h"]["contents"]
          shader_bytes={}
          for shader in data["shaders"]:
              raw=base64.b64decode(shader["bytes"])
              words=struct.unpack("<"+"I"*(len(raw)//4),raw)
              proof_namespace["proof"](words,shader["mvp"],shader["bias"],shader["uv"],shader["normal"])
              literal=re.search(r"program_"+shader["name"]+r"\[\] = \{(.*?)\};",helper,re.S).group(1)
              embedded=tuple(int(x,16) for x in re.findall(r"0x([0-9a-f]+)u",literal))
              if embedded!=words: raise SystemExit("Shader proof/reference mismatch: "+shader["name"])
              shader_bytes[shader["name"]]=raw
          namespace={}
          exec(data["factory"],namespace)
          geometry=data["files"]["src/d3d9/d3d9_rtx_geometry.cpp"]["contents"]
          worker=namespace["make_geometry_fixture"](geometry,
              Path("src/dxvk/rtx_render/rtx_hashing.h").read_text(),
              Path("src/dxvk/rtx_render/rtx_hashing.cpp").read_text())
          call=namespace["make_call_fixture"](geometry)
          matrix=Path(".hbm-movement-tests/matrix_types_under_test.h").read_text()
          # Finish all validation and fixture generation before writing source.
          for name,item in data["files"].items():
              out=item["contents"].encode()
              if b"\r\n" in original[name]: out=out.replace(b"\n",b"\r\n")
              Path(name).write_bytes(out)
          tests=Path(".hbm-rigid-tests");tests.mkdir(exist_ok=True)
          for name,content in {"test_rigid_reuse.cpp":data["test"],"geometry_under_test.h":worker,
              "rigid_call_under_test.h":call,"matrix_types_under_test.h":matrix,
              "capture_replay.txt":data["replay"],"SHADER_PROOF.json":data["proof"]}.items():
              (tests/name).write_text(content,encoding="utf-8")
          (tests/"shaders").mkdir(exist_ok=True)
          for name,raw in shader_bytes.items():
              (tests/"shaders"/("patched_vs_"+name+".bin")).write_bytes(raw)
          (tests/"SOURCE_HASHES.json").write_text(json.dumps({name:{k:v for k,v in x.items() if k!="contents"} for name,x in data["files"].items()},indent=2))
          print("Applied guarded rigid geometry reuse v1; skinning/unknown draws keep original policy; transforms unchanged")

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -N src/util/util_hbm_rigid_geometry_reuse.h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test actual rigid shaders, matrix types, source hashes and capture replay
        run: |
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          $env:HBM_RIGID_GEOMETRY_REUSE = '1'
          cl /nologo /std:c++17 /EHsc /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /I src\util .hbm-rigid-tests\test_rigid_reuse.cpp /Fe:.hbm-rigid-tests\test_rigid_reuse.exe /link user32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.hbm-rigid-tests\test_rigid_reuse.exe .hbm-rigid-tests\capture_replay.txt 2>&1 | Tee-Object .hbm-rigid-tests\validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.hbm-rigid-tests\test_rigid_reuse.exe --env 0 2>&1 | Tee-Object -Append .hbm-rigid-tests\validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.hbm-rigid-tests\test_rigid_reuse.exe --env 1 2>&1 | Tee-Object -Append .hbm-rigid-tests\validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply broader rigid reuse and exclusive capture-buffer allocation pool
        run: |
          @'
          import lzma
          # Applies only on the exact user-confirmed v1 cumulative runtime.
          from pathlib import Path
          import base64, hashlib, json, subprocess, zlib, re, struct
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!="e876135b37295dc203ccdb7b20a8089629588201":
              raise SystemExit("Unexpected pinned source revision")
          data=json.loads(lzma.decompress(base64.b64decode('')))
          original={}
          for name,item in data["files"].items():
              path=Path(name)
              if item["before"] is None:
                  if path.exists():raise SystemExit("New v2 helper already exists: "+name)
                  original[name]=b""
              else:
                  original[name]=path.read_bytes()
                  if hashlib.sha256(original[name].replace(b"\r\n",b"\n")).hexdigest()!=item["before"]:
                      raise SystemExit("V2 baseline differs: "+name)
              if hashlib.sha256(item["contents"].encode()).hexdigest()!=item["after"]:
                  raise SystemExit("V2 payload checksum differs: "+name)
          for name,sha in data["reads"].items():
              if hashlib.sha256(Path(name).read_bytes().replace(b"\r\n",b"\n")).hexdigest()!=sha:
                  raise SystemExit("Pinned lifetime/hashing source differs: "+name)
          proof_namespace={};exec(data["symbolic_proof"],proof_namespace)
          helper=data["files"]["src/util/util_hbm_rigid_geometry_reuse.h"]["contents"]
          shader_bytes={}
          for shader in data["shaders"]:
              raw=base64.b64decode(shader["bytes"]);words=struct.unpack("<"+"I"*(len(raw)//4),raw)
              proof_namespace["proof"](words,shader["mvp"],shader["bias"],shader["uv"],shader["normal"])
              literal=re.search(r"program_"+shader["name"]+r"\[\] = \{(.*?)\};",helper,re.S).group(1)
              if tuple(int(x,16) for x in re.findall(r"0x([0-9a-f]+)u",literal))!=words:
                  raise SystemExit("V2 shader proof/reference mismatch: "+shader["name"])
              shader_bytes[shader["name"]]=raw
          ns={};exec(data["factory"],ns)
          geometry=data["files"]["src/d3d9/d3d9_rtx_geometry.cpp"]["contents"]
          rtx=data["files"]["src/d3d9/d3d9_rtx.cpp"]["contents"]
          fixtures={"geometry_under_test.h":ns["make_geometry_fixture"](geometry,
              Path("src/dxvk/rtx_render/rtx_hashing.h").read_text(),Path("src/dxvk/rtx_render/rtx_hashing.cpp").read_text()),
              "rigid_call_under_test.h":ns["make_call_fixture"](geometry),
              "matrix_types_under_test.h":Path(".hbm-movement-tests/matrix_types_under_test.h").read_text()}
          fixtures.update(ns["make_pool_fixtures"](Path("src/dxvk/dxvk_resource.h").read_text(),
              Path("src/dxvk/dxvk_lifetime.h").read_text(),Path("src/dxvk/dxvk_lifetime.cpp").read_text(),rtx))
          # All inputs, outputs, shader proofs and generated fixtures checked before source writes.
          for name,item in data["files"].items():
              out=item["contents"].encode()
              if b"\r\n" in original[name]:out=out.replace(b"\n",b"\r\n")
              Path(name).write_bytes(out)
          tests=Path(".hbm-rigid-v2-tests");tests.mkdir(exist_ok=True)
          for name,content in {**data["tests"],**fixtures}.items():(tests/name).write_text(content,encoding="utf-8")
          (tests/"shaders").mkdir(exist_ok=True)
          for name,raw in shader_bytes.items():(tests/"shaders"/("patched_vs_"+name+".bin")).write_bytes(raw)
          (tests/"SOURCE_HASHES.json").write_text(json.dumps({name:{k:v for k,v in item.items() if k!="contents"} for name,item in data["files"].items()},indent=2))
          print("Applied v2: transformed rigid reuse + bounded capture allocation pool; six exact shader proofs passed")

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -N src/util/util_hbm_vertex_capture_pool.h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test v2 shaders, transforms, normal bounds and capture replay with x64 MSVC
        run: |
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          $env:HBM_RIGID_GEOMETRY_REUSE = '1'
          cl /nologo /std:c++17 /EHsc /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /I src\util .hbm-rigid-v2-tests\test_rigid_reuse.cpp /Fe:.hbm-rigid-v2-tests\test_rigid_reuse.exe /link user32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.hbm-rigid-v2-tests\test_rigid_reuse.exe .hbm-rigid-v2-tests\capture_replay.txt 2>&1 | Tee-Object .hbm-rigid-v2-tests\rigid_validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($mode in @('0','1')) {
            .\.hbm-rigid-v2-tests\test_rigid_reuse.exe --env $mode 2>&1 | Tee-Object -Append .hbm-rigid-v2-tests\rigid_validation.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\.hbm-rigid-v2-tests\test_rigid_reuse.exe --extended-env $mode 2>&1 | Tee-Object -Append .hbm-rigid-v2-tests\rigid_validation.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test real reference and GPU lifetime interfaces for capture pooling
        run: |
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          cl /nologo /std:c++17 /EHsc /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /I src\util .hbm-rigid-v2-tests\test_capture_pool.cpp /Fe:.hbm-rigid-v2-tests\test_capture_pool.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.hbm-rigid-v2-tests\test_capture_pool.exe 2>&1 | Tee-Object .hbm-rigid-v2-tests\pool_validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($mode in @('0','1')) {
            .\.hbm-rigid-v2-tests\test_capture_pool.exe --env $mode 2>&1 | Tee-Object -Append .hbm-rigid-v2-tests\pool_validation.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Apply capture layout and disjoint geometry future diagnostics
        run: |
          @'
          import lzma
          from pathlib import Path
          import hashlib, json, zlib, base64, subprocess
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!='e876135b37295dc203ccdb7b20a8089629588201':
              raise SystemExit('Unexpected pinned source revision')
          data=json.loads(lzma.decompress(base64.b64decode('')))
          original={}
          for name,item in data['files'].items():
              original[name]=Path(name).read_bytes()
              if hashlib.sha256(original[name].replace(b'\r\n',b'\n')).hexdigest()!=item['before']:
                  raise SystemExit('Capture diagnostics baseline differs: '+name)
              if hashlib.sha256(item['contents'].encode()).hexdigest()!=item['after']:
                  raise SystemExit('Capture diagnostics payload differs: '+name)
          ns={};exec(data['factory'],ns)
          fixture=ns['make_finalizer'](data['files']['src/dxvk/rtx_render/rtx_types.cpp']['contents'])
          # Validate all inputs and fixture extraction before writing any source.
          for name,item in data['files'].items():
              out=item['contents'].encode()
              if b'\r\n' in original[name]:out=out.replace(b'\n',b'\r\n')
              Path(name).write_bytes(out)
          tests=Path('.hbm-capture-tests');tests.mkdir(exist_ok=True)
          (tests/'test_capture_diagnostics.cpp').write_text(data['test'],encoding='utf-8')
          (tests/'finalize_under_test.h').write_text(fixture,encoding='utf-8')
          (tests/'SOURCE_HASHES.json').write_text(json.dumps({n:{k:v for k,v in item.items() if k!='contents'} for n,item in data['files'].items()},indent=2))
          print('Applied capture layout and disjoint future-finalisation diagnostics; rendering policy unchanged')

          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test capture metrics and production finalizer with x64 MSVC
        run: |
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          cl /nologo /std:c++17 /EHsc /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /I src\util .hbm-capture-tests\test_capture_diagnostics.cpp /Fe:.hbm-capture-tests\test_capture_diagnostics.exe /link user32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.hbm-capture-tests\test_capture_diagnostics.exe .hbm-capture-tests\output 2>&1 | Tee-Object .hbm-capture-tests\validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply guarded sparse indexed bounds
        run: |
          @'
          import lzma
          from pathlib import Path
          import hashlib, json, zlib, base64, subprocess
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!='e876135b37295dc203ccdb7b20a8089629588201':
              raise SystemExit('Unexpected pinned source revision')
          data=json.loads(lzma.decompress(base64.b64decode('')))
          original={}
          for name,item in data['files'].items():
              if item['before'] is None:
                  if Path(name).exists():raise SystemExit('Sparse bounds helper already exists: '+name)
                  original[name]=b''
              else:
                  original[name]=Path(name).read_bytes()
                  if hashlib.sha256(original[name].replace(b'\r\n',b'\n')).hexdigest()!=item['before']:
                      raise SystemExit('Sparse bounds baseline differs: '+name)
              if hashlib.sha256(item['contents'].encode()).hexdigest()!=item['after']:
                  raise SystemExit('Sparse bounds payload differs: '+name)
          for name,sha in data['reads'].items():
              if hashlib.sha256(Path(name).read_bytes().replace(b'\r\n',b'\n')).hexdigest()!=sha:
                  raise SystemExit('Pinned sparse bounds dependency differs: '+name)
          baseline=Path('.hbm-bounds-tests/test_bounds.cpp').read_text()
          if hashlib.sha256(baseline.encode()).hexdigest()!=data['baseline_test_sha']:
              raise SystemExit('Original bounds fixture differs')
          ns={};exec(data['factory'],ns)
          fixtures={f.name:f.read_text() for f in Path('.hbm-bounds-tests').glob('*.h')}
          fixtures.update(ns['make_fixtures'](data['files']['src/d3d9/d3d9_rtx_geometry.cpp']['contents'],
              Path('src/dxvk/rtx_render/rtx_utils.h').read_text(),Path('src/dxvk/dxvk_buffer.h').read_text(),baseline))
          fixtures['task_under_test.h']=ns['make_task_fixture'](Path('src/util/util_threadpool.h').read_text())
          # Verify all dependencies and build fixtures before changing production sources.
          for name,item in data['files'].items():
              out=item['contents'].encode()
              if b'\r\n' in original[name]:out=out.replace(b'\n',b'\r\n')
              Path(name).write_bytes(out)
          tests=Path('.hbm-sparse-bounds-tests');tests.mkdir(exist_ok=True)
          for name,content in {**fixtures,**data['tests']}.items():(tests/name).write_text(content,encoding='utf-8')
          (tests/'SOURCE_HASHES.json').write_text(json.dumps({n:{k:v for k,v in item.items() if k!='contents'} for n,item in data['files'].items()},indent=2))
          print('Applied guarded sparse indexed bounds: default ON; >=4096 vertices and >=8x sparsity; original fallbacks/cache hits retained')

