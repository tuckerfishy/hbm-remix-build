er.join();\n  require(!bad, \"concurrent revisions crossed\");\n}\n\nvolatile float resultSink = 0;\nvoid benchmark() {\n  std::cout << \"vertices,stride,original_scan_us,warm_cache_lookup_us,local_ratio\\n\";\n  for (uint32_t count : {64u, 4096u, 65536u}) {\n    Fixture f(count, 32);\n    f.draw();\n    const auto originalRequest = f.request();\n    auto measure = [](auto&& function) {\n      auto start = std::chrono::steady_clock::now();\n      size_t iterations = 0;\n      do {\n        for (unsigned n = 0; n < 8; ++n) { function(); ++iterations; }\n      } while (std::chrono::steady_clock::now() - start < std::chrono::milliseconds(120));\n      return std::chrono::duration<double, std::micro>(std::chrono::steady_clock::now() - start).count() / iterations;\n    };\n    const double scan = measure([&] {\n      auto box = originalScan(f.bytes.data(), count, 32);\n      resultSink = box.minPos.x;\n    });\n    const double lookup = measure([&] {\n      // Includes key preparation, shared CPU-state ownership and revision capture.\n      auto request = f.request();\n      AxisAlignedBoundingBox box;\n      require(request.cache->lookup(request.key, request.revision, box), \"benchmark miss\");\n      resultSink = box.minPos.x;\n    });\n    require(originalRequest.cache != nullptr, \"benchmark cache missing\");\n    std::cout << count << \",32,\" << scan << ',' << lookup << ',' << scan / lookup << '\\n';\n  }\n}\n\nint main(int argc, char** argv) {\n  if (argc > 1 && std::string(argv[1]) == \"--benchmark\") { benchmark(); return 0; }\n  runtimeFixtures();\n  keyAndEvictionFixtures();\n  randomizedFixtures();\n  concurrentFixtures();\n  std::cout << \"PASS: production eligibility/resource/worker hooks; 1200 exact bounds sequences; 20000 concurrent invalidations.\\n\";\n  std::cout << \"CPU cache allocation bytes per source buffer: \"\n            << sizeof(BoundingBoxMemoizer<AxisAlignedBoundingBox>) << '\\n';\n}\n"
          }""")
          tests = Path(".hbm-bounds-tests")
