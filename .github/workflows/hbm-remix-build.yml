# Put this file at .github/workflows/hbm-remix-build.yml in your GitHub repository.
# This workflow has been checked locally but has not yet run on GitHub.
# It builds only the x64 runtime DLL for the existing e876135b Remix installation.
name: Build HBM Remix VRAM fix

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: remix

    steps:
      - name: Fetch matching Remix source and submodules
        uses: actions/checkout@v4
        with:
          repository: NVIDIAGameWorks/dxvk-remix
          ref: e876135b37295dc203ccdb7b20a8089629588201
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
          path: remix

      - name: Install build helper
        run: |
          python -m pip install meson==1.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply the checked draw-state ownership fix
        run: |
          @'
          import hashlib
          from pathlib import Path
          import subprocess

          expected_revision = "e876135b37295dc203ccdb7b20a8089629588201"
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected_revision:
              raise SystemExit("Unexpected source revision; refusing to patch")

          path = Path("src/dxvk/rtx_render/rtx_types.h")
          original = path.read_bytes()
          data = original.replace(b"\r\n", b"\n")
          expected_before = "c6124ce05b4c4909b1f11a4430b8fb8dc6a19f3066e683f669b44a2131514d7e"
          expected_after = "59f43fad6149772694a7943ebcb1217bef610e3ac3d26b9557c4d3ed2af80cc6"
          if hashlib.sha256(data).hexdigest() != expected_before:
              raise SystemExit("Source header does not match the tested patch")

          old = (
              b"  DrawCallState() = default;\n"
              b"  DrawCallState(const DrawCallState& _input) = default;\n"
              b"  DrawCallState& operator=(const DrawCallState& drawCallState) = default;\n"
          )
          new = old + (
              b"  // Queue transfers must relinquish geometry resources in consumed ring slots.\n"
              b"  DrawCallState(DrawCallState&&) = default;\n"
              b"  DrawCallState& operator=(DrawCallState&&) = default;\n"
          )
          if data.count(old) != 1:
              raise SystemExit("Patch location is not unique")
          patched = data.replace(old, new)
          if hashlib.sha256(patched).hexdigest() != expected_after:
              raise SystemExit("Patched header failed verification")
          path.write_bytes(patched.replace(b"\n", b"\r\n") if b"\r\n" in original else patched)
          print("Applied the validated VRAM queue fix. No BLAS animation fix is included.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat

      - name: Build x64 release runtime
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
          . .\build_common.ps1
          # The upstream public workflow uses this Windows runner and build helper.
          # Skip private game test captures; they are not needed to compile the DLL.
          PerformBuild -BuildFlavour release -BuildSubDir _Comp64Release -Backend ninja -EnableTracy false -SkipApics $true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package the runtime DLL
        run: |
          $runtimePath = Join-Path (Get-Location) '_output\d3d9.dll'
          if (!(Test-Path $runtimePath)) { throw 'Release d3d9.dll was not produced' }
          $binary = [System.IO.File]::ReadAllBytes($runtimePath)
          if ($binary.Length -lt 64 -or $binary[0] -ne 0x4d -or $binary[1] -ne 0x5a) {
            throw 'Output is not a Windows executable image'
          }
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 26 -gt $binary.Length) { throw 'Invalid PE header offset' }
          if ([BitConverter]::ToUInt32($binary, $peOffset) -ne 0x00004550 -or
              [BitConverter]::ToUInt16($binary, $peOffset + 4) -ne 0x8664 -or
              [BitConverter]::ToUInt16($binary, $peOffset + 24) -ne 0x20b) {
            throw 'Output is not an x64 PE32+ runtime DLL'
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $runtimePath artifact\d3d9.dll
          $runtimeHash = (Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$runtimeHash  d3d9.dll" | Set-Content artifact\d3d9.sha256.txt -Encoding utf8
          @"
          Source: NVIDIAGameWorks/dxvk-remix e876135b37295dc203ccdb7b20a8089629588201
          Fix: DrawCallState move constructor and move assignment.
          Build: x64 release on GitHub windows-2022.
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          In-game validation: pending.
          "@ | Set-Content artifact\BUILD_INFO.txt -Encoding utf8
          @'
          Close the game before changing runtime files.
          Back up your current .trex/d3d9.dll, then replace that file with this x64 DLL.
          Keep the matching e876135b Remix runtime dependencies and bridge already installed.
          DO NOT overwrite the game-root d3d9.dll: that is the separate x86 HITMAN proxy.
          Keep your existing INI, rtx.conf, user.conf and mod assets.
          This test includes only the VRAM draw-queue fix, not the merged-BLAS animation fix.
          Test the casino/foyer/outside traversal and monitor VRAM, geometry and animation.
          The build passed compilation and PE architecture checks, not an in-game GPU test.
          Restore the backed-up runtime DLL if launch or rendering regresses.
          '@ | Set-Content artifact\INSTALL.txt -Encoding utf8

      - name: Upload release DLL
        uses: actions/upload-artifact@v4
        with:
          name: hbm-remix-e876135-vram-fix-release
          path: remix/artifact/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbm-remix-build-logs
          path: |
            remix/_Comp64Release/meson-logs/*
            remix/_Comp64Release/update-deps.log
            remix/update-deps.log
          if-no-files-found: ignore
          retention-days: 7
